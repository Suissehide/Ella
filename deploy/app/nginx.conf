server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Behind the reverse proxy: redirects (e.g. /fiction -> /fiction/) must keep the public host and scheme
    absolute_redirect off;

    gzip on;
    gzip_types text/css application/javascript image/svg+xml application/xml text/plain;

    location ~* \.(css|js|svg|png|jpg|webp|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public";
    }

    location = /sitemap.xml { add_header Cache-Control "no-cache"; }

    location / {
        try_files $uri $uri/ =404;
    }

    error_page 404 /404.html;
}
